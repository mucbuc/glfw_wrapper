name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test-native:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: |
          cd test
          cmake -B build
          cmake --build build

      - name: Test fails
        run: |
          cd test
          if ctest --test-dir build; then
            echo "ERROR: Test should have failed but passed"
            exit 1
          else
            echo "Test failed as expected"
            exit 0
          fi

