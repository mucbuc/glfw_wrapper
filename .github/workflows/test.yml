name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-native:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: |
          cd test
          cmake -B build
          cmake --build build

      - name: Test fails
        run: |
          cd test
          ctest --test-dir build

